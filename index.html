<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng dụng học từ vựng</title>

  <link rel="stylesheet" href="styles.topauth.v2.css?v=20260924-topauth-v2">

  <!-- Đọc file Excel -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <!-- Code của ứng dụng -->
  <script defer src="app.topauth.v2.js?v=20260924-topauth-v2"></script>
</head>

<body>
  <main class="container">

    <section class="card">
      <div class="hero-row">
        <div class="hero-left">
          <div class="app-title-line">
            <h1>📚 Ứng dụng học từ vựng</h1>
            <span id="buildBadge" class="build-badge">Build mới</span>
          </div>

          <p class="muted hero-subtitle">
            Import Excel → lưu thành sổ tay → chọn sổ để học → kiểm tra → chấm điểm
          </p>
        </div>

        <div class="header-auth-slot">
          <div class="auth-box auth-floating">
            <button id="loginBtn" type="button">🔐 Đăng nhập Google</button>

            <div id="userChip" class="user-chip">
              <img id="userPhoto" alt="Ảnh đại diện">
              <span id="userName"></span>
            </div>

            <button id="logoutBtn" type="button" class="secondary hidden">Đăng xuất</button>

            <span id="authStatus" class="auth-status">Chưa đăng nhập.</span>
            <span id="syncStatus" class="sync-status"></span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <label class="file-label">
          📂 Chọn file Excel
          <input type="file" id="fileInput" accept=".xlsx,.xls">
        </label>

        <button id="shuffleBtn" type="button">🔀 Trộn từ</button>
        <button id="restoreBtn" type="button" class="secondary">↩️ Thứ tự gốc</button>
        <button id="resetBtn" type="button" class="danger">🗑️ Xóa tiến độ</button>
      </div>

      <section class="notebook-card compact-notebook">
        <div class="compact-notebook-row">
          <div class="compact-book-title" title="Sổ tay từ vựng">
            <span>📒</span><strong>Sổ tay</strong>
          </div>

          <select id="notebookSelect" class="compact-control" title="Chọn sổ tay">
            <option value="">— Chọn sổ tay —</option>
          </select>

          <input class="compact-control notebook-name-input" type="text" id="notebookName"
                 maxlength="80" placeholder="Tên sổ tay" title="Tên sổ tay">

          <div class="compact-actions">
            <button id="saveNotebookBtn" type="button" class="btn-notebook-save">💾 Lưu</button>
            <button id="newNotebookBtn" type="button" class="btn-soft compact-icon-btn" title="Tạo sổ mới">＋</button>
            <button id="deleteNotebookBtn" type="button" class="btn-soft danger-soft compact-icon-btn" title="Xóa sổ">🗑</button>
          </div>

          <div class="active-notebook-pill compact-pill">
            <span class="dot"></span>
            <span id="activeNotebookLabel">Chưa chọn sổ</span>
          </div>
        </div>
        <div id="notebookStatus" class="notebook-status compact-notebook-status"></div>
      </section>

      <div class="compact-settings">
        <div class="compact-setting columns-setting">
          <span class="compact-label">👁 Cột</span>
          <label><input type="checkbox" id="showWord" checked> Từ</label>
          <label><input type="checkbox" id="showPron" checked> Phiên âm</label>
          <label><input type="checkbox" id="showPos" checked> Loại từ</label>
          <label><input type="checkbox" id="showMeaning" checked> Nghĩa</label>
        </div>

        <div class="compact-setting">
          <span class="compact-label">📝 Kiểm tra</span>
          <select id="quizColumn">
            <option value="">Không kiểm tra</option>
            <option value="Từ">Từ</option>
            <option value="Phiên âm">Phiên âm</option>
            <option value="Loại từ">Loại từ</option>
            <option value="Nghĩa">Nghĩa</option>
          </select>
        </div>

        <div class="compact-setting">
          <span class="compact-label">🔎 Lọc</span>
          <select id="progressFilter">
            <option value="all">Toàn bộ</option>
            <option value="known">Đã thuộc</option>
            <option value="unknown">Chưa thuộc</option>
          </select>
        </div>
      </div>

      <div class="micro-help">Đã thuộc = đánh dấu thủ công hoặc từng trả lời đúng.</div>

      <div id="status" class="status">Chưa có dữ liệu.</div>
    </section>

    <section class="card">
      <h2>Danh sách từ</h2>

      <div class="table-wrap">
        <table id="vocabTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="scoreBox" class="score-box"></div>
    </section>

    <div id="stickyGradeBar" class="sticky-grade-bar">
      <div class="sticky-grade-info">
        <strong id="stickyQuizLabel">Chọn nội dung kiểm tra</strong>
        <span id="stickyCountLabel"></span>
      </div>
      <div class="sticky-grade-actions">
        <button id="stickyShuffleBtn" type="button" class="sticky-secondary">🔀 Trộn</button>
        <button id="stickyGradeBtn" type="button" class="sticky-primary">✅ Chấm điểm</button>
      </div>
    </div>

  </main>
</body>
</html>
